<text x="1600.0" y="1312" fill="#686862" font-family="Arial, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="end">200</text>
<rect x="150" y="1370" width="1700.000" height="2" fill="#d7d3cb"/>
<text x="150" y="1401" fill="#18191b" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">70 successful RTPs per plugin. No basic landing-check failures.</text>
<text x="150" y="1454" fill="#686862" font-family="Arial, sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Paper 26.3 · Java 25 · one client · restored world snapshot · queue and protection disabled.</text>
<text x="150" y="1497" fill="#686862" font-family="Arial, sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Median samples: 10–20 requests per scenario. Random destinations; not CPU/RAM usage.</text>
<text x="150" y="1540" fill="#686862" font-family="Arial, sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Flat Overworld; results are not a general performance or safety guarantee. Method and p95 in the report.</text>
<text x="150" y="1620" fill="#18191b" font-family="Arial, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">modrinth.com/plugin/dyrtp</text>
