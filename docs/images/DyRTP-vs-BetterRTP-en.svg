<text x="555" y="518" fill="#18191b" font-family="Arial, sans-serif" font-size="30" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">BetterRTP 3.6.13</text>
<text x="1850" y="520" fill="#686862" font-family="Arial, sans-serif" font-size="28" font-weight="400" dominant-baseline="text-before-edge" text-anchor="end">MEDIAN · ms</text>
<text x="150" y="592" fill="#18191b" font-family="Arial, sans-serif" font-size="32" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">Overworld · 16–96 · first pass</text>
