<text x="190" y="518" fill="#18191b" font-family="Arial, sans-serif" font-size="30" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">DyRTP 1.0.0</text>
<rect x="515" y="523" width="26.000" height="26" fill="#aaa8a0"/>
