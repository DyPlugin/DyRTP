<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1680" viewBox="0 0 2000 1680">
<title>DyRTP versus BetterRTP: median command-to-teleport time</title>
<desc>Five matched-setting samples on Paper 26.3. 70 successful requests per plugin. Lower is faster. One client; protection and queue disabled; not CPU or RAM usage.</desc>
<rect width="2000" height="1680" fill="#f4f2ed"/>
<text x="150" y="80" fill="#18191b" font-family="Arial, sans-serif" font-size="68" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">DyRTP</text>
<text x="1850" y="104" fill="#686862" font-family="Arial, sans-serif" font-size="26" font-weight="400" dominant-baseline="text-before-edge" text-anchor="end">2 PLUGINS · 70 RTPs EACH</text>
<text x="150" y="254" fill="#18191b" font-family="Arial, sans-serif" font-size="68" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">Same settings. Measured RTP.</text>
<text x="150" y="356" fill="#248b46" font-family="Arial, sans-serif" font-size="64" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">Lower median time in these samples.</text>
<text x="150" y="454" fill="#686862" font-family="Arial, sans-serif" font-size="34" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Command-to-teleport time. Lower is faster.</text>
