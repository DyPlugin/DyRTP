<rect x="150" y="1255" width="1450.000" height="24" fill="#e2dfd7"/>
<rect x="150" y="1255" width="1442.909" height="24" fill="#aaa8a0"/>
<text x="1850" y="1247" fill="#18191b" font-family="Arial, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" text-anchor="end">199.02 ms</text>
<text x="150.0" y="1312" fill="#686862" font-family="Arial, sans-serif" font-size="24" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">0</text>
