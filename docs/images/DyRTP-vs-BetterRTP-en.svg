<rect x="150" y="1370" width="1700.000" height="2" fill="#d7d3cb"/>
<text x="150" y="1401" fill="#18191b" font-family="Arial, sans-serif" font-size="29" font-weight="700" dominant-baseline="text-before-edge" text-anchor="start">70 successful RTPs each. Basic check failures: DyRTP 0; BetterRTP 0.</text>
<text x="150" y="1454" fill="#686862" font-family="Arial, sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Paper 26.1.2 · Java 25 · one client · restored world snapshot · queue and protection disabled.</text>
<text x="150" y="1497" fill="#686862" font-family="Arial, sans-serif" font-size="25" font-weight="400" dominant-baseline="text-before-edge" text-anchor="start">Median samples: 10–20 requests per scenario. Random destinations; not CPU/RAM usage.</text>
