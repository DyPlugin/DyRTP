name: DyRTP
version: ${version}
main: dev.dyrtp.DyRTP
api-version: '1.20'
folia-supported: true
description: Fast random teleport plugin with land-protection integration and English, Turkish, German, Spanish and Russian messages.
author: DyPlugin
website: https://github.com/DyPlugin/DyRTP
softdepend:
  - DyClaim
  - PlaceholderAPI
  - Vault
  - WorldGuard
  - GriefPrevention
  - Towny
  - Lands
  - Residence
  - GriefDefender
  - RedProtect
  - Factions
  - FactionsUUID
  - SaberFactions
  - FactionsBridge
  - Kingdoms
  - hClaims
  - HuskClaims
  - HuskTowns
  - UltimateClaims
  - Pueblos
  - CrashClaim
  - ProtectionStones
  - PlotSquared
  - MinePlots
  - BentoBox
  - SuperiorSkyblock2
  - ClaimChunk
  - GriefPreventionFlags

commands:
  dyrtp:
    description: DyRTP commands
    usage: /<command> [subcommand]
    aliases:
      - dyr
      - rtp
      - randomtp
      - wild
      - wildtp
      - rastgeletp
      - rastgeleteleport
  dyra:
    description: DyRTP administration commands
    usage: /<command> [subcommand]
  onayla:
    description: Confirm a pending DyRTP teleport
    usage: /<command>
    aliases:
      - confirm
  reddet:
    description: Cancel a pending DyRTP teleport
    usage: /<command>
    aliases:
      - cancel
  forcertp:
    description: Force a player to use DyRTP
    usage: /<command> <player>
    aliases:
      - rtpforce

permissions:
  dyrtp.use:
    description: Allows using random teleport.
    default: true
  dyrtp.group:
    description: Invite players to travel together with /dyrtp group.
    default: true
  dyrtp.biome:
    description: Allows /rtp biome to choose the destination biome.
    default: true
  dyrtp.admin:
    description: Allows using admin commands.
    default: op
  dyrtp.bypass.cooldown:
    description: Bypass RTP cooldown.
    default: op
  dyrtp.bypass.warmup:
    description: Bypass RTP warmup.
    default: op
  dyrtp.bypass.economy:
    description: Bypass RTP cost.
    default: op
  dyrtp.world.*:
    description: Choose any world allowed by world-selection with /rtp world <world>. Use dyrtp.world.<world> for single worlds.
    default: true
  dyrtp.sign:
    description: Use RTP signs.
    default: true
  dyrtp.portal:
    description: Use RTP portal regions.
    default: true
  dyrtp.near:
    description: Use /rtp near when distance-presets are on.
    default: true
  dyrtp.far:
    description: Use /rtp far when distance-presets are on.
    default: true
  dyrtp.back:
    description: Use /rtp back to return once to where you were before your last RTP.
    default: true
  dyrtp.stats:
    description: See your own RTP count with /rtp stats.
    default: true
  dyrtp.stats.others:
    description: See another player's RTP count with /rtp stats <player>.
    default: op
